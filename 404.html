<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — ProBot Solutions</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0EA5E9;
      --primary-dark: #0284C7;
      --primary-light: #E0F2FE;
      --dark: #0c1a2e;
      --muted: #64748b;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--primary-light);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo { margin-bottom: 40px; }
    .logo img { height: 32px; }
    .code {
      font-size: clamp(72px, 20vw, 140px);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 16px; max-width: 420px; line-height: 1.6; margin-bottom: 36px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: 0.2s ease;
    }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-dark); }
    .btn--ghost { background: #fff; color: var(--dark); border: 1.5px solid #cbd5e1; }
    .btn--ghost:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="logo">
    <a href="index.html" aria-label="ProBot Solutions home">
      <img src="logo.svg" alt="ProBot Solutions" />
    </a>
  </div>
  <div class="code" aria-hidden="true">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <div class="actions">
    <a href="index.html" class="btn btn--primary">← Back to Home</a>
    <a href="playbook.html" class="btn btn--ghost">AI Receptionist Playbook</a>
  </div>
</body>
</html>
